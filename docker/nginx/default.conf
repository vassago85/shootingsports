upstream php_fpm {
    server 127.0.0.1:9000;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 64m;

    root /var/www/html/public;
    index index.php index.html;

    charset utf-8;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "frame-ancestors $frame_ancestors" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()" always;

    location = /favicon.ico { access_log off; log_not_found off; }

    # robots.txt is dynamic: RobotsController toggles Disallow: / from
    # SEO_INDEXABLE. Send it through Laravel instead of letting nginx
    # 404 on a missing static file.
    location = /robots.txt {
        access_log off;
        log_not_found off;
        try_files $uri /index.php?$query_string;
    }

    # Pictures live on the host 4TB volume, bind-mounted to MEDIA_ROOT.
    location /media/ {
        alias /var/www/html/storage/app/media/;
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass php_fpm;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT   $realpath_root;
        fastcgi_read_timeout 120s;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
