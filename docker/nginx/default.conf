upstream php_fpm {
    server 127.0.0.1:9000;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 110m;

    root /var/www/html/public;
    index index.php index.html;

    charset utf-8;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "frame-ancestors $frame_ancestors" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()" always;

    location = /favicon.ico { access_log off; log_not_found off; }

    # pdf.js loads its worker as an ES module (*.mjs). Debian's mime.types
    # has no .mjs mapping, so these files otherwise inherit
    # default_type application/octet-stream and the browser rejects them
    # under X-Content-Type-Options: nosniff.
    location ~* \.mjs$ {
        default_type application/javascript;
    }

    # robots.txt is dynamic: RobotsController toggles Disallow: / from
    # SEO_INDEXABLE. Send it through Laravel instead of letting nginx
    # 404 on a missing static file.
    location = /robots.txt {
        access_log off;
        log_not_found off;
        try_files $uri /index.php?$query_string;
    }

    # Pictures live on the host 4TB volume, bind-mounted to MEDIA_ROOT.
    location /media/ {
        alias /var/www/html/storage/app/media/;
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Expo PWA shell for shooters. The exported Expo web bundle lives in
    # /var/www/html/public/app/ (populated by the `pwa` Dockerfile stage).
    # Client-side routes like /app/calendar, /app/find, /app/me are not
    # real files, so fall back to /app/index.html — the SPA then reads
    # location.pathname and renders the right tab. Laravel never sees
    # these requests, so CanonicalHost and friends stay out of the way.
    # ^~ prevents the regex PHP location below from stealing nested paths.
    location ^~ /app/ {
        try_files $uri $uri/ /app/index.html;
    }

    # Bare /app with no trailing slash — send to /app/ so the manifest
    # start_url "." resolves against /app/ (the installed PWA's origin
    # directory) and relative asset paths match the deployed base path.
    location = /app {
        return 301 /app/;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass php_fpm;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT   $realpath_root;
        fastcgi_read_timeout 120s;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
