<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="ShootingSports reticle">
    <title>ShootingSports</title>
    <!-- Dark rounded tile so the gold reticle reads on both light and dark browser chrome. -->
    <rect width="64" height="64" rx="12" fill="#1B1F27"/>
    <!-- Outer ring -->
    <circle cx="32" cy="32" r="26" fill="none" stroke="#D9AE52" stroke-width="3"/>
    <!-- Inner ring -->
    <circle cx="32" cy="32" r="12" fill="none" stroke="#D9AE52" stroke-width="2"/>
    <!-- Crosshair ticks (broken to keep the centre dot readable at 16px) -->
    <path d="M32 4v14 M32 46v14 M4 32h14 M46 32h14"
          stroke="#D9AE52" stroke-width="3" stroke-linecap="round"/>
    <!-- Centre dot -->
    <circle cx="32" cy="32" r="3.5" fill="#D9AE52"/>
</svg>
